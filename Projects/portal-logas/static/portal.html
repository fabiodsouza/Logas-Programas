<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumo de GNC | Logás</title>
<link rel="icon" href="/static/img/favicon.png" type="image/png">
<script src="/static/vendor/chart.umd.js"></script>
<style>
  :root{
    --bg:#070b14; --bg2:#0a1120; --panel:#0f1828; --panel2:#13203a; --line:#22324d;
    --text:#eef4fd; --muted:#8298b9; --cyan:#3bc4ec;
    --green:#2bd18a; --yellow:#f4cb53; --orange:#f59140; --red:#f1556a;
    --shadow:0 4px 20px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#0d1730,var(--bg));
       color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
         padding:12px 20px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,rgba(20,32,58,.6),transparent)}
  header .marca{display:flex;align-items:center;gap:15px}
  header .marca img{height:52px;width:auto;display:block}
  header .ttl{font-size:17px;font-weight:800;letter-spacing:.4px}
  header .ttl span{color:var(--cyan)}
  header .sub{color:var(--muted);font-size:12px;margin-top:3px}
  header .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text);
       border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
       font-family:inherit;letter-spacing:.2px}
  .btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .btn.on{background:var(--cyan);border-color:var(--cyan);color:#04121b}

  main{padding:16px 20px 40px;max-width:1240px;margin:0 auto}
  .cards{display:grid;gap:14px;grid-template-columns:1fr}
  .bloco{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
         border-radius:12px;padding:13px 15px 15px;box-shadow:var(--shadow);
         border-left:4px solid var(--green)}
  .bloco .cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .bloco .cab .nm{font-size:15px;font-weight:800;letter-spacing:.3px}
  .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
        padding:10px 12px 11px;min-height:74px}
  .tile .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .tile .v small{font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}
  .tile .v small.linha{display:block;margin:2px 0 0;font-size:11.5px}
  .tile .r{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;
           font-weight:700;margin-top:5px;line-height:1.35}
  .tile.destaque{background:rgba(59,196,236,.08);border-color:rgba(59,196,236,.35)}
  .pill{font-size:10px;font-weight:800;letter-spacing:.7px;padding:4px 9px;
        border-radius:20px;text-transform:uppercase;margin-left:auto}
  .obs{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}

  section.hist{margin-top:22px;background:linear-gradient(180deg,var(--panel),var(--bg2));
               border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;
               box-shadow:var(--shadow)}
  .hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .hrow h2{margin:0;font-size:12px;color:var(--cyan);font-weight:800;
           text-transform:uppercase;letter-spacing:1.2px;flex:1 1 auto}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
         border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit}
  .wrap{position:relative;height:340px}
  .grid2{display:grid;gap:16px;grid-template-columns:1fr;margin-top:16px}
  @media (min-width:900px){.grid2{grid-template-columns:1.35fr 1fr}}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 14px}
  .stat .rot{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
             font-weight:700}
  .stat .val{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
  .stat .val small{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:3px}
  .stat .val small.linha{display:block;margin:1px 0 0}
  .var.sobe{color:var(--orange)} .var.desce{color:var(--green)}
  .trocas{list-style:none;margin:0;padding:0;font-size:13px}
  .trocas li{display:flex;align-items:baseline;gap:10px;padding:8px 2px;
             border-top:1px solid var(--line)}
  .trocas li:first-child{border-top:0}
  .trocas .qd{font-variant-numeric:tabular-nums}
  .trocas .de{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
  .vazio{color:var(--muted);font-size:13px;padding:26px 0;text-align:center}
  @media (max-width:560px){
    .wrap{height:260px}
    header{padding:10px 14px}
    main{padding:14px 14px 30px}
  }
</style>
</head>
<body>
<div id="aviso" style="display:none;background:var(--yellow);color:#1c1503;
     padding:9px 20px;font-size:12.5px;font-weight:700;
     align-items:center;gap:12px;flex-wrap:wrap">
  <span id="avisoTexto"></span>
  <button id="voltarAdmin" type="button" style="margin-left:auto;background:#1c1503;
     color:var(--yellow);border:0;border-radius:8px;padding:6px 12px;font-size:12px;
     font-weight:700;cursor:pointer;font-family:inherit">Voltar à administração</button>
</div>

<header>
  <div class="marca">
    <img src="/static/img/logo.png" alt="Logás">
    <div>
      <div class="ttl">Consumo de <span>GNC</span></div>
      <div class="sub" id="sub">Carregando…</div>
    </div>
  </div>
  <div class="dir">
    <button class="btn" id="xls" type="button">Baixar Excel</button>
    <button class="btn" id="sair" type="button">Sair</button>
  </div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <section class="hist" id="secHist">
    <div class="hrow">
      <h2>Histórico de pressão</h2>
      <select id="ponto" aria-label="Ponto"></select>
      <button class="btn" data-h="24" type="button">24 h</button>
      <button class="btn on" data-h="72" type="button">72 h</button>
      <button class="btn" data-h="168" type="button">7 dias</button>
      <button class="btn" data-h="720" type="button">30 dias</button>
    </div>
    <div class="wrap"><canvas id="cv"></canvas></div>
  </section>

  <section class="hist" id="secAux" style="display:none">
    <div class="hrow"><h2 id="tituloAux">Temperatura e pressão de saída</h2></div>
    <div class="wrap" style="height:260px"><canvas id="cvAux"></canvas></div>
  </section>

  <div class="grid2">
    <section class="hist" id="secDia" style="margin-top:0">
      <div class="hrow">
        <h2>Consumo por dia</h2>
        <button class="btn on" data-d="14" type="button">2 semanas</button>
        <button class="btn" data-d="30" type="button">1 mês</button>
      </div>
      <div class="stats" id="statsDia"></div>
      <div class="wrap" style="height:230px"><canvas id="cvDia"></canvas></div>
    </section>

    <section class="hist" id="secTrocas" style="margin-top:0">
      <div class="hrow"><h2>Reabastecimentos</h2></div>
      <div class="stats" id="statsTroca"></div>
      <ul class="trocas" id="listaTrocas"></ul>
    </section>
  </div>
</main>

<script>
const COR={ok:"var(--green)",atencao:"var(--yellow)",critico:"var(--orange)",
           abaixo:"var(--red)",sem_sinal:"var(--muted)",sem_dados:"var(--muted)"};
const PALETA={verde:"var(--green)", amarelo:"var(--yellow)", laranja:"var(--orange)",
              vermelho:"var(--red)", azul:"var(--cyan)", cinza:"var(--muted)"};
const ROTULO={ok:"Normal",atencao:"Atenção",critico:"Crítico",
              abaixo:"Abaixo da reserva",sem_sinal:"Sem sinal",sem_dados:"Sem leitura"};

let DADOS=null, horas=72, grafico=null;

// O servidor manda em DADOS.secoes o que este cliente pode ver. O que não está
// liberado nem chega aqui, então a seção é escondida por completo.
const pode = c => !DADOS || !DADOS.secoes || DADOS.secoes.includes(c);

const fmtNum = v => Number(v).toFixed(2).replace(".", ",");
const fmtDT  = s => s ? new Date(s).toLocaleString("pt-BR",
  {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";

// Converte Bar em m3 quando o config.json tem o fator do ponto; senão fica em Bar.
let M3 = null;
// Milhar com ponto e decimal com vírgula, como se escreve em português.
// Volume em m³ chega a cinco dígitos, e "23808" sem separador não se lê.
function num(v, dec){
  return Number(v).toLocaleString("pt-BR",
    {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

function un(bar, por, dec){
  if(bar == null) return "—";
  const sufixo = por === "h" ? "/h" : (por === "d" ? "/dia" : "");
  const v = M3 ? bar*M3 : bar;
  // Em m³ os números são grandes: uma casa decimal já é ruído, e nenhuma nos
  // totais diários. Em Bar as duas casas continuam fazendo sentido.
  const d = dec !== undefined ? dec : (M3 ? (v >= 100 ? 0 : 1) : 2);
  return num(v, d) + (M3 ? " m³" : " Bar") + sufixo;
}

// Valor com as duas unidades: o Bar em destaque, que é o que o manômetro lê, e
// o volume convertido embaixo, em cinza. Sem fator de conversão, só o Bar.
function unDupla(bar, por, decBar){
  if(bar == null) return "—";
  const sufixo = por === "h" ? "/h" : "";
  const emBar = num(bar, decBar === undefined ? 2 : decBar) + " Bar" + sufixo;
  if(!M3) return emBar;
  const v = bar * M3;
  const emM3 = num(v, v >= 100 ? 0 : 1) + " m³" + sufixo;
  return `${emBar}<small class="linha">${emM3}</small>`;
}

const hora = s => s ? new Date(s).toLocaleTimeString("pt-BR",
  {hour:"2-digit",minute:"2-digit"}) : "—";

function fmtH(h){
  if(h==null) return "—";
  if(h<=0) return "0 h";
  if(h<1) return Math.round(h*60)+" min";
  return (Math.round(h*10)/10).toString().replace(".",",")+" h";
}

async function carregar(){
  const r = await fetch("/api/consumo?horas="+horas, {cache:"no-store"});
  if(r.status === 401){ location.href = "/entrar"; return; }
  if(!r.ok){ document.getElementById("sub").textContent = "Falha ao buscar os dados. Tentando de novo em instantes."; return; }
  DADOS = await r.json();
  desenhar();
}

function desenhar(){
  document.title = DADOS.cliente + " — Consumo de GNC | Logás";
  document.getElementById("sub").textContent =
    DADOS.cliente + " · última leitura registrada em " + fmtDT(DADOS.atualizado);

  document.getElementById("secHist").style.display   = pode("historico") ? "" : "none";
  document.getElementById("secDia").style.display    = pode("por_dia")   ? "" : "none";
  document.getElementById("secTrocas").style.display = pode("trocas")    ? "" : "none";
  document.getElementById("xls").style.display =
    (pode("excel") || DADOS.espiando) ? "" : "none";
  document.querySelector(".grid2").style.display =
    (pode("por_dia") || pode("trocas")) ? "" : "none";

  const esp = DADOS.espiando;
  const aviso = document.getElementById("aviso");
  if(esp){
    document.getElementById("avisoTexto").textContent =
      "Você está vendo a tela de " + esp.login + " como administrador. "
      + "É exatamente o que este cliente vê.";
    aviso.style.display = "flex";
  } else {
    aviso.style.display = "none";
  }

  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  if(!DADOS.pontos.length){
    cards.innerHTML = '<p class="vazio">Nenhum ponto vinculado a este acesso. Fale com a Logás.</p>';
    return;
  }

  DADOS.pontos.forEach(p=>{
    const st = DADOS.conjunto && p.status_conjunto ? p.status_conjunto : p.status;
    const h  = DADOS.conjunto && p.horas_conjunto !== undefined ? p.horas_conjunto : p.horas_ate_limite;
    const chegada = DADOS.conjunto ? p.chegada_conjunto : p.chegada_prevista;
    const cons = DADOS.conjunto && p.consumo_conjunto ? p.consumo_conjunto : p.consumo_barh;
    M3 = p.m3_por_bar || null;

    const el = document.createElement("article");
    el.className = "bloco";
    el.style.borderLeftColor = COR[st] || "var(--muted)";

    const tile = (valor, rotulo, cor, destaque) =>
      `<div class="tile${destaque?" destaque":""}">
         <div class="v"${cor?` style="color:${cor}"`:""}>${valor}</div>
         <div class="r">${rotulo}</div>
       </div>`;

    // Se o servidor for de uma versão anterior e não mandar 'anterior', dá para
    // tirar do próprio histórico as duas últimas leituras com valor.
    const comValor = (p.historico||[]).filter(r=>r.p!==null);
    const ant = p.anterior || (pode("pressao") && comValor.length>=2
      ? {p: comValor[comValor.length-2].p, t: comValor[comValor.length-2].t} : null);
    const uv = p.ultima_variacao || (ant && comValor.length>=2 ? (()=>{
      const ultimo = comValor[comValor.length-1];
      const dh = (new Date(ultimo.t) - new Date(ant.t))/3600000;
      if(!(dh>0)) return null;
      const d = ant.p - ultimo.p;
      return {bar:Math.abs(d), horas:Math.round(dh*10)/10, barh:Math.abs(d)/dh,
              troca:d<0 && Math.abs(d)>=25, subiu:d<0};
    })() : null);

    let tiles = "";
    if(p.pressao !== null){
      if(ant && pode("pressao"))
        tiles += tile(`${fmtNum(ant.p)}<small>Bar</small>`,
                      `Leitura anterior · ${hora(ant.t)}`);

      if(p.projetado && p.pressao_lida != null){
        // Sem sinal: separa o que foi lido do que é estimativa, senão os números
        // não fecham entre si na tela.
        tiles += tile(`${fmtNum(p.pressao_lida)}<small>Bar</small>`,
                      `Última leitura · ${hora(p.medido_em)}`);
        tiles += tile(`${fmtNum(p.pressao)}<small>Bar</small>`,
                      "Pressão estimada agora", COR[st], true);
      } else {
        tiles += tile(`${fmtNum(p.pressao)}<small>Bar</small>`,
                      `Pressão atual · ${hora(p.medido_em)}`, COR[st], true);
      }

      if(uv && pode("consumo"))
        tiles += tile(uv.troca ? "Carreta<br>trocada"
                      // A taxa só acrescenta quando o intervalo não é de uma
                      // hora; senão repetiria o mesmo número.
                      : unDupla(uv.bar, "", uv.bar < 10 ? 2 : 1),
                      uv.troca ? "Entre as duas últimas fotos"
                      : (uv.horas===1 ? "Consumo na última hora"
                                      : `Consumo nas últimas ${fmtH(uv.horas)}`),
                      uv.troca ? "var(--green)" : null);

      if(cons != null)
        tiles += tile(unDupla(cons, "h") + (p.consumo_estimado ? " *" : ""),
                      "Consumo médio");

      // Leituras auxiliares do ponto (temperatura, pressão de saída, etc).
      (p.auxiliares||[]).forEach(a=>{
        const v = Number(a.valor).toFixed(a.casas==null?1:a.casas).replace(".",",");
        const u = a.unidade === "C" ? "°C" : a.unidade;
        tiles += tile(`${v}${u?`<small>${u}</small>`:""}`,
                      `${a.rotulo} · ${hora(a.medido_em)}`,
                      PALETA[a.cor] || null);
      });
      if(h != null)
        tiles += tile(fmtH(h), "Autonomia até a reserva", COR[st]);
      if(chegada)
        tiles += tile(fmtDT(chegada).replace(", ","<br>"), "Reabastecimento previsto",
                      "var(--cyan)");
      const t = p.trocas || {};
      if(t.ultima && pode("trocas"))
        tiles += tile(fmtDT(t.ultima).replace(", ","<br>"),
                      `Última troca de carreta${t.horas_desde_ultima!=null?` · há ${fmtH(t.horas_desde_ultima)}`:""}`);
    } else {
      tiles += tile("—", "Sem leitura registrada");
    }

    let obs = "";
    if(p.sem_sinal) obs = "Sem leitura nova desde " + fmtDT(p.medido_em) +
      ". A pressão acima é uma projeção pelo consumo médio.";
    else if(p.consumo_estimado) obs = "* Consumo estimado: ainda não há quedas suficientes medidas neste ponto.";
    if(DADOS.conjunto){
      const sup = (DADOS.pontos.find(x=>x.suprindo)||{}).ponto;
      if(p.suprindo) obs = "Baia em uso agora. " + obs;
      else if(p.pressao !== null && p.pressao <= p.minimo && sup)
        obs = "Baia esgotada; o consumo está sendo atendido pela " + sup + ". " + obs;
    }

    el.innerHTML =
      `<div class="cab">
         <span class="nm">${p.ponto}</span>
         <span class="pill" style="background:${COR[st]||"var(--muted)"};color:#04121b">${ROTULO[st]||""}</span>
       </div>
       <div class="tiles">${tiles}</div>
       ${obs?`<p class="obs">${obs}</p>`:""}`;
    cards.appendChild(el);
  });

  const sel = document.getElementById("ponto");
  const atual = sel.value;
  sel.innerHTML = DADOS.pontos.map(p=>`<option>${p.ponto}</option>`).join("");
  if(DADOS.pontos.some(p=>p.ponto===atual)) sel.value = atual;
  sel.style.display = DADOS.pontos.length>1 ? "" : "none";

  grafo();
  grafoAux();
  grafoDia();
  trocas();
}

function grafo(){
  const nome = document.getElementById("ponto").value || (DADOS.pontos[0]||{}).ponto;
  const p = DADOS.pontos.find(x=>x.ponto===nome);
  if(!p) return;
  const serie = p.historico || [];
  const curto = horas <= 48;
  const labels = serie.map(r=>{
    const d = new Date(r.t);
    return curto ? d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
                 : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})
                   + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  });
  const valores = serie.map(r=>r.p);

  if(grafico) grafico.destroy();
  grafico = new Chart(document.getElementById("cv"), {
    type:"line",
    data:{labels, datasets:[
      {label:"Pressão (Bar)", data:valores, borderColor:"#3bc4ec",
       backgroundColor:"rgba(59,196,236,.14)", borderWidth:2, pointRadius:2,
       tension:.3, fill:true, spanGaps:true},
      {label:"Reserva mínima", data:labels.map(()=>p.minimo), borderColor:"#f1556a",
       borderDash:[6,5], borderWidth:1.5, pointRadius:0, fill:"start",
       backgroundColor:"rgba(241,85,106,.10)"},
      {label:"Carreta trocada", borderColor:"#2bd18a", backgroundColor:"#2bd18a",
       showLine:false, pointRadius:5, pointStyle:"triangle",
       data:serie.map((r,i)=>{
         const ant = serie[i-1];
         return (ant && r.p!=null && ant.p!=null && r.p-ant.p >= 25) ? r.p : null;
       })}
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:"index", intersect:false},
      scales:{
        x:{ticks:{color:"#8298b9", maxRotation:0, autoSkip:true, maxTicksLimit:10},
           grid:{color:"rgba(34,50,77,.6)"}},
        y:{beginAtZero:true, ticks:{color:"#8298b9"}, grid:{color:"rgba(34,50,77,.6)"},
           title:{display:true, text:M3?"m³":"Bar", color:"#8298b9"}}
      },
      plugins:{legend:{labels:{color:"#8298b9", boxWidth:12}}}
    }
  });
}

let gAux = null;
const CORAUX = ["#f59140", "#3bc4ec", "#2bd18a", "#f4cb53"];

function grafoAux(){
  const sec = document.getElementById("secAux");
  const p = pontoAtual();
  const series = ((p && p.auxiliares) || []).filter(a => (a.historico||[]).length > 1);
  if(!pode("auxiliares") || !series.length){ sec.style.display = "none"; return; }
  sec.style.display = "";
  document.getElementById("tituloAux").textContent =
    series.map(a => a.rotulo).join(" e ");

  // Cada série tem seu próprio horário de leitura, então o eixo é montado a
  // partir da união dos horários; onde falta valor a linha atravessa.
  const horarios = [...new Set(series.flatMap(a => a.historico.map(r => r.t)))].sort();
  const curto = horas <= 48;
  const labels = horarios.map(t=>{
    const d = new Date(t);
    return curto ? d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
                 : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})
                   + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  });

  // Unidades diferentes (°C e Bar) pedem eixos separados, senão uma escala
  // achata a outra.
  const unidades = [...new Set(series.map(a => a.unidade || ""))];
  const eixoDe = u => unidades.length > 1 && unidades.indexOf(u) === 1 ? "y2" : "y";
  const rotulo = u => u === "C" ? "°C" : (u || "");

  const datasets = series.map((a,i)=>{
    const mapa = {};
    a.historico.forEach(r => { mapa[r.t] = r.p; });
    return {
      label: a.rotulo + (rotulo(a.unidade) ? ` (${rotulo(a.unidade)})` : ""),
      data: horarios.map(t => t in mapa ? mapa[t] : null),
      borderColor: CORAUX[i % CORAUX.length],
      backgroundColor: "transparent",
      borderWidth: 2, pointRadius: 2, tension: .3, spanGaps: true,
      yAxisID: eixoDe(a.unidade || ""),
    };
  });

  const escalas = {
    x:{ticks:{color:"#8298b9",maxRotation:0,autoSkip:true,maxTicksLimit:10},
       grid:{color:"rgba(34,50,77,.6)"}},
    y:{ticks:{color:"#8298b9"}, grid:{color:"rgba(34,50,77,.6)"},
       title:{display:true, text:rotulo(unidades[0]), color:"#8298b9"}}
  };
  if(unidades.length > 1)
    escalas.y2 = {position:"right", ticks:{color:"#8298b9"}, grid:{drawOnChartArea:false},
                  title:{display:true, text:rotulo(unidades[1]), color:"#8298b9"}};

  if(gAux) gAux.destroy();
  gAux = new Chart(document.getElementById("cvAux"), {
    type:"line",
    data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:"index", intersect:false},
      scales: escalas,
      plugins:{legend:{labels:{color:"#8298b9", boxWidth:12}}}
    }
  });
}

let diasJanela = 14, gDia = null;

function pontoAtual(){
  const nome = document.getElementById("ponto").value || (DADOS.pontos[0]||{}).ponto;
  return DADOS.pontos.find(x=>x.ponto===nome) || DADOS.pontos[0];
}

function grafoDia(){
  const p = pontoAtual();
  if(!p) return;
  M3 = p.m3_por_bar || null;
  const serie = (p.por_dia||[]).slice(-diasJanela);
  const hoje = new Date().toISOString().slice(0,10);
  // O dia de hoje ainda está em andamento, então não entra na média.
  const fechados = serie.filter(d=>d.dia !== hoje);
  const media = fechados.length ? fechados.reduce((a,d)=>a+d.bar,0)/fechados.length : null;
  const maior = fechados.length ? fechados.reduce((a,d)=>d.bar>a.bar?d:a) : null;

  const s = p.semana || {};
  const v = s.variacao_pct;
  document.getElementById("statsDia").innerHTML = `
    <div class="stat"><div class="rot">Média por dia</div>
      <div class="val">${un(media,"",0)}</div></div>
    <div class="stat"><div class="rot">Últimos 7 dias</div>
      <div class="val">${un(s.atual,"",0)}</div></div>
    <div class="stat"><div class="rot">7 dias anteriores</div>
      <div class="val">${un(s.anterior,"",0)}
        ${v==null?"":`<small class="var ${v>0?"sobe":"desce"}">${v>0?"+":""}${v}%</small>`}</div></div>
    ${maior?`<div class="stat"><div class="rot">Dia de maior consumo</div>
      <div class="val" style="font-size:15px;padding-top:5px">${maior.dia.slice(8,10)}/${maior.dia.slice(5,7)}
        <small>${un(maior.bar,"",0)}</small></div></div>`:""}`;

  const labels = serie.map(d=>d.dia.slice(8,10)+"/"+d.dia.slice(5,7));
  const valores = serie.map(d=>M3 ? d.bar*M3 : d.bar);
  const cores = serie.map(d=>d.dia===hoje ? "rgba(59,196,236,.35)" : "rgba(59,196,236,.75)");

  if(gDia) gDia.destroy();
  gDia = new Chart(document.getElementById("cvDia"), {
    type:"bar",
    data:{labels, datasets:[{label:(M3?"m³":"Bar")+" por dia", data:valores,
          backgroundColor:cores, borderRadius:3, borderSkipped:false}]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>{
          const txt = num(c.parsed.y, 0) + (M3 ? " m³" : " Bar");
          const hoje = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
          return txt + (labels[c.dataIndex]===hoje ? "  (dia em andamento)" : "");
        }}}},
      scales:{
        x:{ticks:{color:"#8298b9",maxRotation:0,autoSkip:true,maxTicksLimit:12},
           grid:{display:false}},
        y:{beginAtZero:true,
           ticks:{color:"#8298b9", callback:v => num(v,0)},
           grid:{color:"rgba(34,50,77,.6)"},
           title:{display:true, text:M3?"m³":"Bar", color:"#8298b9"}}
      }
    }
  });
}

function trocas(){
  const p = pontoAtual();
  M3 = (p && p.m3_por_bar) || null;
  const t = (p && p.trocas) || {};
  const alvo = document.getElementById("listaTrocas");
  document.getElementById("statsTroca").innerHTML = `
    <div class="stat"><div class="rot">Última</div>
      <div class="val" style="font-size:15px;padding-top:5px">${fmtDT(t.ultima)}
        ${t.horas_desde_ultima!=null?`<small>há ${fmtH(t.horas_desde_ultima)}</small>`:""}</div></div>
    <div class="stat"><div class="rot">Nos últimos 7 dias</div>
      <div class="val">${t.em_7_dias!=null?t.em_7_dias:"—"}</div></div>
    <div class="stat"><div class="rot">Intervalo médio</div>
      <div class="val" style="font-size:17px;padding-top:6px">${fmtH(t.intervalo_medio_h)}</div></div>`;

  const ev = t.eventos || [];
  alvo.innerHTML = ev.length ? ev.map(e=>`
      <li><span class="qd">${fmtDT(e.t)}</span>
          <span class="de">${fmtNum(e.de)} → ${fmtNum(e.para)} Bar</span></li>`).join("")
    : '<li style="color:var(--muted)">Nenhuma troca registrada no período.</li>';
}

document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-d]").forEach(o=>o.classList.remove("on"));
  b.classList.add("on");
  diasJanela = Number(b.dataset.d);
  grafoDia();
}));

function excel(){
  location.href = "/api/excel?horas=" + horas;
}

document.querySelectorAll("[data-h]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-h]").forEach(o=>o.classList.remove("on"));
  b.classList.add("on");
  horas = Number(b.dataset.h);
  carregar();
}));
document.getElementById("ponto").addEventListener("change", ()=>{grafo(); grafoAux(); grafoDia(); trocas();});
document.getElementById("xls").addEventListener("click", excel);
document.getElementById("sair").addEventListener("click", async ()=>{
  if(DADOS && DADOS.espiando){
    await fetch("/api/parar-de-ver",{method:"POST"});
    location.href = "/admin";
    return;
  }
  await fetch("/sair",{method:"POST"});
  location.href = "/entrar";
});

document.getElementById("voltarAdmin").addEventListener("click", async ()=>{
  await fetch("/api/parar-de-ver",{method:"POST"});
  location.href = "/admin";
});

carregar();
setInterval(carregar, 300000);   // atualiza a cada 5 min
</script>
</body>
